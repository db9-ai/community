name: Feature Request
description: Suggest a new feature or improvement
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public issue.** For suspected vulnerabilities, stop here and use [security@db9.ai](mailto:security@db9.ai). See the [security reporting policy](https://github.com/db9-ai/community/security/policy).

        Remove passwords, API tokens, connection strings, session cookies, private keys, and customer data from text, logs, SQL, screenshots, URLs, and attachments. Use fictional data. This form does not automatically redact content.

        We'd love to hear your ideas for improving DB9.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's the use case?
      placeholder: I'm trying to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of DB9 does this relate to?
      options:
        - CLI
        - SDK (get-db9)
        - SQL / Query Engine
        - Extensions (fs9, vector, http, pg_cron, etc.)
        - Branching
        - Dashboard / Web
        - Documentation
        - New Extension
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted screenshots, public links, or other relevant context. Remove credentials and customer data from all attachments.

  - type: checkboxes
    id: public-report-check
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets and customer data, and this is not a private vulnerability report.
          required: true
