name: Bug Report
description: Report a bug in DB9
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public issue.** For suspected vulnerabilities, stop here and use [security@db9.ai](mailto:security@db9.ai). See the [security reporting policy](https://github.com/db9-ai/community/security/policy).

        Remove passwords, API tokens, connection strings, session cookies, private keys, and customer data from text, logs, SQL, screenshots, URLs, and attachments. Use fictional data. This form does not automatically redact content.

        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps using test data. Replace credentials, private URLs, and real customer values with placeholders.
      placeholder: |
        1. Run `db9 ...`
        2. Execute query `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of DB9 is affected?
      options:
        - CLI
        - SDK (get-db9)
        - SQL / Query Engine
        - Extensions (fs9, vector, http, pg_cron, etc.)
        - Branching
        - Dashboard / Web
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, DB9 CLI version, SDK version, etc. Do not paste your environment-variable file or credentials.
      placeholder: |
        - OS: macOS 15.3
        - Node: v22.0.0
        - db9 CLI: 0.4.2
        - get-db9 SDK: 0.3.1

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error output
      description: Only the relevant, redacted error lines. Remove tokens, passwords, connection strings, cookies, private keys, and customer data before pasting.
      render: shell

  - type: checkboxes
    id: public-report-check
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets and customer data, and this is not a private vulnerability report.
          required: true
