name: Question
description: Ask a question about DB9
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public issue.** For suspected vulnerabilities, stop here and use [security@db9.ai](mailto:security@db9.ai). See the [security reporting policy](https://github.com/db9-ai/community/security/policy).

        Remove passwords, API tokens, connection strings, session cookies, private keys, and customer data from text, logs, SQL, screenshots, URLs, and attachments. Use fictional data. This form does not automatically redact content.

        Have a question about using DB9? We're happy to help.
        For real-time help, you can also join our [Discord](https://discord.gg/5P3RuyZCgs).

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of DB9 does this relate to?
      options:
        - Getting Started
        - CLI
        - SDK (get-db9)
        - SQL / Query Engine
        - Extensions
        - Branching
        - Migrations
        - AI Agent Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Minimal redacted code, errors, or documentation links. Remove credentials, private URLs, and real customer data before posting.

  - type: checkboxes
    id: public-report-check
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets and customer data, and this is not a private vulnerability report.
          required: true
