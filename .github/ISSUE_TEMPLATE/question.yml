name: Question
description: Ask a question about DB9
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using DB9? We're happy to help.
        For real-time help, you can also join our [Discord](https://discord.gg/5P3RuyZCgs).

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of DB9 does this relate to?
      options:
        - Getting Started
        - CLI
        - SDK (get-db9)
        - SQL / Query Engine
        - Extensions
        - Branching
        - Migrations
        - AI Agent Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Code snippets, error messages, or links to docs you've already checked.
